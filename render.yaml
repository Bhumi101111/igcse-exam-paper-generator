# Render Blueprint — IGCSE Paper Generator
# Single Node web service: Express serves the static frontend and the /api routes.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: igcse-paper-generator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
